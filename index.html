<style>
html,body,#map{height:100%;margin:0} body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#25302b}
#map{background:#e8e4da} .top{position:absolute;z-index:1000;left:12px;right:12px;top:12px;background:rgba(255,253,248,.96);border-radius:16px;padding:12px 14px;box-shadow:0 5px 24px #0002;max-width:720px}
.title{font-weight:800;font-size:18px} .sub{font-size:12px;color:#6d746f;margin-top:2px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-top:9px;padding-bottom:2px} .f{white-space:nowrap;border:1px solid #ddd4c7;background:white;border-radius:999px;padding:6px 9px;font-size:12px} .f.off{opacity:.35}
.locate{position:absolute;right:12px;bottom:32px;z-index:1000;background:#fff;border:0;border-radius:50%;width:48px;height:48px;box-shadow:0 3px 14px #0003;font-size:20px}
.panel{position:fixed;z-index:1200;left:0;right:0;bottom:0;background:#fffdf8;border-radius:22px 22px 0 0;box-shadow:0 -5px 30px #0003;padding:18px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.22s;max-height:64vh;overflow:auto}
.panel.show{transform:translateY(0)} .panel h2{margin:0 35px 4px 0;font-size:22px} .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:#eee6d9;margin:2px 4px 7px 0}
.addr{background:#f3eee5;border-radius:12px;padding:10px;margin:8px 0;font-size:14px} .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0} .actions button,.actions a{border:0;border-radius:12px;padding:11px;text-align:center;text-decoration:none;background:#294b3d;color:white;font-size:14px} .actions .secondary{background:#e9e3d8;color:#25302b}
.close{position:absolute;right:14px;top:14px;border:0;background:#eee6da;border-radius:50%;width:30px;height:30px}
.leaflet-popup-content-wrapper{border-radius:12px} .legend{position:absolute;z-index:900;left:12px;bottom:26px;background:#fffdf8dd;border-radius:10px;padding:7px 9px;font-size:11px;box-shadow:0 2px 10px #0002}
@media(min-width:850px){.top{left:20px;top:20px} .panel{left:auto;right:20px;bottom:20px;width:390px;border-radius:20px;max-height:75vh} .legend{left:20px}}
</style></head>

<script>
const pois=[{"name": "绩溪北站", "cat": "交通", "lat": 30.071139, "lon": 118.571604, "area": "绩溪县城", "day": "10/4", "addr": "安徽省宣城市绩溪县龙川大道", "note": "10/4 两人分别约16:00、18:00抵达。", "nav": "绩溪北站"}, {"name": "绩溪古城安遇酒店", "cat": "酒店", "lat": 30.0712, "lon": 118.5952, "area": "绩溪县城", "day": "10/4-10/7", "addr": "安徽省宣城市绩溪县适之街010号", "note": "已订3晚。靠近绩溪博物馆与古城片区。", "nav": "绩溪古城安遇酒店"}, {"name": "绩溪博物馆", "cat": "景点", "lat": 30.071397, "lon": 118.595564, "area": "绩溪县城", "day": "10/4/机动", "addr": "安徽省宣城市绩溪县良安路100号附近", "note": "到达日低负担散步候选；国庆开放安排出发前复核。", "nav": "绩溪博物馆"}, {"name": "红泥美食坊", "cat": "正餐", "lat": 30.0719, "lon": 118.5948, "area": "绩溪县城", "day": "10/4/晚餐", "addr": "安徽省宣城市绩溪县良安路76号", "note": "紧邻博物馆/文庙。人均约60-67；石耳炖土鸡、绩溪炒粉丝、干锅炖等。电话0563-8166866。", "nav": "红泥美食坊 绩溪"}, {"name": "绩溪早茶馆·绩溪味道", "cat": "早餐", "lat": 30.0669, "lon": 118.5868, "area": "绩溪县城", "day": "10/5或10/6", "addr": "安徽省宣城市绩溪县华阳镇聚和圆徽菜馆斜对面", "note": "公开文旅资料称人均约15元，传统点心较集中；适合挞粿/水馅包等早餐体验。电话15464584840。", "nav": "绩溪早茶馆 绩溪味道"}, {"name": "聚和圆·老绩溪菜", "cat": "正餐", "lat": 30.0672, "lon": 118.5865, "area": "绩溪县城", "day": "晚餐候选", "addr": "安徽省宣城市绩溪县梓潼路48号", "note": "09:00-20:00（平台当前）；官方电话0563-8168799。浇头面、绩溪焖粉、南瓜焖粿等本地菜有代表性。", "nav": "聚和圆 绩溪 梓潼路48号"}, {"name": "中国徽菜文化交流中心", "cat": "正餐", "lat": 30.0738, "lon": 118.5777, "area": "绩溪县城", "day": "晚餐候选", "addr": "安徽省宣城市绩溪县龙川大道150号", "note": "10:30-20:00（平台当前）；人均约103。胡适一品锅、绩溪焖粉、毛豆腐、小挞粿。订餐0563-8585777。", "nav": "中国徽菜文化交流中心 绩溪"}, {"name": "中国绩溪徽菜（徽厨）博物馆", "cat": "正餐", "lat": 30.0668, "lon": 118.5875, "area": "绩溪县城", "day": "机动", "addr": "安徽省宣城市绩溪县梓潼路57号", "note": "餐饮+徽菜文化体验。公开营业时段9:00-13:30、16:30-20:30；电话0563-8165777。", "nav": "中国绩溪徽菜徽厨博物馆"}, {"name": "龙川景区", "cat": "景点", "lat": 30.077517, "lon": 118.669893, "area": "龙川", "day": "10/5", "addr": "安徽省宣城市绩溪县瀛洲镇龙川景区", "note": "08:00-17:20，17:00停止入场；成人票75元。建议2.5-3小时。", "nav": "绩溪龙川景区"}, {"name": "仁里旅游度假区", "cat": "景点", "lat": 30.033926, "lon": 118.610987, "area": "仁里", "day": "10/5", "addr": "安徽省宣城市绩溪县瀛洲镇仁里村", "note": "青石板古村、徽商古道生活感；旅行团常给约2-2.5小时。", "nav": "绩溪仁里旅游度假区"}, {"name": "红霞农家乐", "cat": "正餐", "lat": 30.0342, "lon": 118.6112, "area": "仁里", "day": "10/5", "addr": "安徽省宣城市绩溪县瀛洲镇仁里村", "note": "官方/文旅资料反复收录；人均约60，黑猪肉等农家徽味。电话0563-8318495。", "nav": "红霞农家乐 绩溪仁里"}, {"name": "上庄景区/胡适故居", "cat": "景点", "lat": 30.123159, "lon": 118.44418, "area": "上庄", "day": "10/6", "addr": "安徽省宣城市绩溪县上庄镇上庄村", "note": "胡适故居、徽墨文化、人文慢游。2026已开通绩溪北站至上庄旅游直达专线。", "nav": "胡适故居 绩溪上庄"}, {"name": "放空水口咖啡", "cat": "咖啡", "lat": 30.1218, "lon": 118.446, "area": "上庄", "day": "10/6", "addr": "安徽省宣城市绩溪县上庄镇（上庄景区水口片区）", "note": "官方确认的上庄村咖业态之一；适合作为午后休息。精确门牌/营业时间国庆前复核。", "nav": "放空水口咖啡 上庄 绩溪"}, {"name": "上庄书局", "cat": "逛店", "lat": 30.1225, "lon": 118.445, "area": "上庄", "day": "10/6", "addr": "安徽省宣城市绩溪县上庄镇上庄景区", "note": "2026官方资料确认的书香文旅节点，适合慢逛、休息。", "nav": "上庄书局 绩溪"}, {"name": "紫园", "cat": "景点", "lat": 30.047478, "lon": 118.600734, "area": "绩溪县城东", "day": "10/6", "addr": "安徽省宣城市绩溪县上马石村紫园景区", "note": "县城东侧短距离点，适合下午轻量游览；可作为电动车体验日的核心短途目的地。", "nav": "绩溪紫园"}, {"name": "西递景区", "cat": "景点", "lat": 29.90334, "lon": 117.99599, "area": "西递", "day": "10/7", "addr": "安徽省黄山市黟县西递镇西递村", "note": "10/7转场日核心。历史数据表明国庆3-6日往往是高峰区间；建议带行李预约车直达。", "nav": "西递古村景区"}, {"name": "西递三畏堂餐厅", "cat": "正餐", "lat": 29.9037, "lon": 117.9965, "area": "西递", "day": "10/7", "addr": "安徽省黄山市黟县西递村内胡氏宗祠前小溪顺水约20米", "note": "10:30-20:00（平台当前），人均约60。笋干炒肉、臭鳜鱼、五加皮野菜摊蛋、毛豆腐。", "nav": "西递三畏堂餐厅"}, {"name": "徽娘私房菜", "cat": "正餐", "lat": 29.9035, "lon": 117.996, "area": "西递", "day": "10/7", "addr": "安徽省黄山市黟县西递景区内，近胡氏宗祠敬爱堂", "note": "人均约67；土鸡汤、雪菜小竹笋、笋衣烧肉、招牌米酒等。作为三畏堂排队过长时的Plan B。", "nav": "西递徽娘私房菜"}, {"name": "汪一挑馄饨（西递）", "cat": "小吃", "lat": 29.9029, "lon": 117.998, "area": "西递", "day": "10/7", "addr": "安徽省黄山市黟县西递镇031县道东约150米", "note": "人均约23；馄饨、酒酿饼、葛粉圆子、艾叶粿。适合不想吃大餐时。", "nav": "汪一挑馄饨 西递古村景区店"}, {"name": "塔川潦草·晓院", "cat": "酒店", "lat": 30.013, "lon": 118.0048, "area": "塔川", "day": "10/7起", "addr": "安徽省黄山市黟县宏村镇塔川村卢古组卢家尖10号", "note": "已订1晚；靠近塔川，去宏村约短车程。10/8可续住。", "nav": "塔川潦草晓院"}, {"name": "塔川", "cat": "景点", "lat": 30.011771, "lon": 118.0034, "area": "塔川", "day": "10/7-10/8", "addr": "安徽省黄山市黟县宏村镇塔川村", "note": "10月上旬通常不是红叶峰值；住宿优势在傍晚/清晨村落与山景。", "nav": "塔川景区"}, {"name": "宏村南湖", "cat": "拍照", "lat": 30.00135, "lon": 117.99055, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区南湖", "note": "清晨与傍晚比正午更适合拍摄；一日团通常会集中经过。", "nav": "宏村南湖"}, {"name": "宏村月沼", "cat": "拍照", "lat": 30.0031, "lon": 117.99025, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区月沼", "note": "核心机位；得月楼、画景楼都在月沼边。", "nav": "宏村月沼"}, {"name": "得月楼（月沼店）", "cat": "正餐", "lat": 30.00318, "lon": 117.99018, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村风景区月沼015号（汪氏宗祠对面）", "note": "人均约67；二楼靠窗正对月沼。毛豆腐、腊肉笋煲等。电话18134596759；国庆建议提前电话问景观位。", "nav": "宏村得月楼 月沼店"}, {"name": "画景楼（月沼店）", "cat": "正餐", "lat": 30.00314, "lon": 117.99013, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村月沼014号（汪氏宗祠对面）", "note": "10:00-22:00（平台当前），人均约68；月沼景观位。得月楼景观位订不到时的强Plan B。", "nav": "画景楼 宏村 月沼店"}, {"name": "添灯食堂", "cat": "正餐", "lat": 30.0034, "lon": 117.991, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村风景区中街81号（近月沼）", "note": "10:00-21:00，人均约74；电话0559-5541023 / 18855910808。臭鳜鱼、毛豆腐、刀板香、五加皮炒蛋。", "nav": "添灯食堂 宏村"}, {"name": "徽八鲜", "cat": "正餐", "lat": 30.0035, "lon": 117.9912, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区中街86号", "note": "10:00-22:00，人均约55；评论量较大。臭鳜鱼、腊肉笋尖煲、酸菜野笋、桂花米酒。", "nav": "徽八鲜 宏村"}, {"name": "枫杨楼（宏村大树店）", "cat": "正餐", "lat": 30.0025, "lon": 117.9889, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村村530国道旁宏村红杨树旁", "note": "人均约63-64；靠古树一侧，适合作为不想挤月沼时的备选。", "nav": "枫杨楼 宏村大树店"}, {"name": "旧时光咖啡馆", "cat": "咖啡", "lat": 30.0036, "lon": 117.9911, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区内（中街/月沼附近）", "note": "人均约35；咖啡+明信片/纪念品，适合中午最拥挤时段坐下来休息。", "nav": "旧时光咖啡馆 宏村"}, {"name": "培德堂小吃部", "cat": "小吃", "lat": 30.00345, "lon": 117.99105, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区内", "note": "人均约15；鸭腿、栗子饼等。适合垫肚子，不必每顿都吃完整徽菜。", "nav": "培德堂小吃部 宏村"}, {"name": "胡兴堂中式糕点", "cat": "伴手礼", "lat": 30.0027, "lon": 117.9892, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区内（宏村一店）", "note": "烧饼、徽墨酥等伴手礼；作为地图提示点，不列为必买。", "nav": "胡兴堂中式糕点 宏村一店"}, {"name": "宏茗轩茶行", "cat": "伴手礼", "lat": 30.0033, "lon": 117.9914, "area": "宏村", "day": "10/8", "addr": "安徽省黄山市黟县宏村景区内", "note": "平台购物榜中评价较高的茶行之一；买茶前仍建议现场看标价与产地。", "nav": "宏茗轩茶行 宏村"}];
const colors={"酒店": "#8d5a44", "交通": "#416b8a", "景点": "#3e7657", "拍照": "#8b6a9b", "早餐": "#d9913b", "正餐": "#b95c43", "小吃": "#d07b43", "咖啡": "#765b4d", "逛店": "#6d738d", "伴手礼": "#9a7b32"};
const cats=["酒店", "交通", "景点", "拍照", "早餐", "正餐", "小吃", "咖啡", "逛店", "伴手礼"];
const map=L.map('map',{zoomControl:true}).setView([30.02,118.28],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layers={}, markers=[];
cats.forEach(c=>{layers[c]=L.layerGroup().addTo(map);});
function markerIcon(cat){return L.divIcon({className:'',html:`<div style="width:20px;height:20px;border-radius:50%;background:${colors[cat]||'#555'};border:3px solid white;box-shadow:0 1px 6px #0005"></div>`,iconSize:[20,20],iconAnchor:[10,10]})}
pois.forEach((p,i)=>{const m=L.marker([p.lat,p.lon],{icon:markerIcon(p.cat)}).addTo(layers[p.cat]);m.on('click',()=>showPoi(i));markers.push(m);});
const filters=document.getElementById('filters');
cats.forEach(c=>{const b=document.createElement('button');b.className='f';b.textContent=c;b.dataset.on='1';b.onclick=()=>{if(b.dataset.on==='1'){map.removeLayer(layers[c]);b.dataset.on='0';b.classList.add('off')}else{layers[c].addTo(map);b.dataset.on='1';b.classList.remove('off')}};filters.appendChild(b);});
function copyText(t){navigator.clipboard?.writeText(t).then(()=>alert('已复制：'+t)).catch(()=>prompt('长按复制：',t));}
function showPoi(i){const p=pois[i]; const q=encodeURIComponent(p.nav); const aq=encodeURIComponent(p.addr);
document.getElementById('panelBody').innerHTML=`<h2>${p.name}</h2><span class="tag">${p.cat}</span><span class="tag">${p.area}</span><span class="tag">${p.day}</span>
<div class="addr"><b>地址</b><br>${p.addr}</div><p>${p.note}</p>
<div class="actions"><button onclick='copyText(${JSON.stringify(p.addr)})'>复制地址</button><button class="secondary" onclick='copyText(${JSON.stringify(p.name)})'>复制名称</button>
<a href="https://uri.amap.com/search?keyword=${q}" target="_blank">高德搜索</a><a class="secondary" href="https://maps.apple.com/?q=${aq}" target="_blank">Apple 地图</a></div>`;
document.getElementById('panel').classList.add('show'); map.panTo([p.lat,p.lon]);}
function closePanel(){document.getElementById('panel').classList.remove('show')}
function locateMe(){if(!navigator.geolocation) return alert('浏览器不支持定位');navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];L.circleMarker(ll,{radius:8,color:'#1769aa',fillOpacity:.8}).addTo(map).bindPopup('你的位置').openPopup();map.setView(ll,15)},()=>alert('无法获取定位，请检查浏览器定位权限'));}
</script></body></html>
